name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: go mod tidy -diff

      # ADR 0001: regenerate and compare, ignoring only protoc's version line,
      # and fail on generated files that were never committed.
      - name: Check generated code is current
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
          go generate ./...
          git diff --exit-code -I '^//[[:space:]]+protoc[[:space:]]'
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Run tests with race detector
        run: go test -race ./...
